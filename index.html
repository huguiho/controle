<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle Financeiro do Casal</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1c1b18;--mu:#6b6a64;--bd:#e4e2da;--a:#2a6df4;--b:#d9468f;--fx:#7a5af8;--vr:#e08a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15150f;--card:#1f1f18;--tx:#f1efe7;--mu:#a09e92;--bd:#34332a;--a:#6c9bff;--b:#f278b3;--fx:#a48dff;--vr:#f5a524}}
:root[data-theme="dark"]{--bg:#15150f;--card:#1f1f18;--tx:#f1efe7;--mu:#a09e92;--bd:#34332a;--a:#6c9bff;--b:#f278b3;--fx:#a48dff;--vr:#f5a524}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{font-size:1.3rem;margin:0}
input,select,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 11px;min-width:0}
button{cursor:pointer}
.top{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.k small{color:var(--mu);display:block}.k b{font-size:1.25rem}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
.p{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;border-top:5px solid var(--c)}
.p h2{margin:0 0 8px;font-size:1.1rem;display:flex;justify-content:space-between;align-items:center;gap:8px}
.p h2 button{font-size:.75rem;padding:4px 8px;color:var(--mu)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 12px}
.sum div{background:var(--bg);border-radius:10px;padding:8px}.sum small{color:var(--mu);display:block;font-size:.72rem}.sum b{font-size:.95rem}
form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
form .w{grid-column:1/-1}
form button{background:var(--c);color:#fff;border:0;font-weight:600}
h3{font-size:.85rem;margin:14px 0 6px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.bar{margin:6px 0}.bar div:first-child{display:flex;justify-content:space-between;font-size:.88rem}
.bar i{display:block;height:7px;border-radius:5px;background:var(--c);margin-top:3px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--bd)}
li .d{flex:1;min-width:0}li .d span{display:block;color:var(--mu);font-size:.78rem}
.t{font-size:.68rem;padding:2px 7px;border-radius:99px;color:#fff}.fixo{background:var(--fx)}.variavel{background:var(--vr)}
li button{border:0;background:none;color:var(--mu);padding:4px 8px}
.empty{color:var(--mu);padding:10px 0}
.gn{color:#1a9d5a}.neg{color:#d93b3b}.ganho{background:#1a9d5a}
[hidden]{display:none!important}
.lg{grid-template-columns:1fr;max-width:340px;margin:12vh auto}.lg button{background:var(--a);color:#fff;border:0;font-weight:600}.lg small{color:#d93b3b}
</style>
</head>
<body>
<div class="wrap" id="login" hidden><form id="lf" class="lg"><h1>💰 Controle Financeiro</h1><input name="email" type="email" placeholder="E-mail" required autocomplete="username"><input name="senha" type="password" placeholder="Senha" required autocomplete="current-password"><button>Entrar</button><small id="le"></small></form></div>
<div class="wrap" id="app" hidden>
<header>
<h1>💰 Controle Financeiro do Casal</h1>
<span><input type="month" id="mes" aria-label="Mês"> <button id="sair">Sair</button></span>
</header>
<div class="top" id="top"></div>
<div class="cols" id="cols"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPA_URL="https://huyqddkuafeqjvhtxgcw.supabase.co",SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh1eXFkZGt1YWZlcWp2aHR4Z2N3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ4MDQxNzMsImV4cCI6MjExMDM4MDE3M30.R2ak24x5X7vLJCHWeosGNWaV-AQhi7dv_IzH28ZfBB0";
const CATS=["Moradia","Mercado","Transporte","Combustível","Manutenção da moto","Contas (luz, água, internet)","Saúde","Lazer","Educação","Assinaturas","Dívidas/Parcelas","Outros"];
const GANHOS=["Salário","Ganho do dia","Extra/Bico","Outros ganhos"];
const R=v=>v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S={nomes:{a:"Hugo",b:"Esposa"},itens:[]};
try{const x=localStorage.getItem("cfc_nomes");if(x)S.nomes=JSON.parse(x)}catch(e){}
const save=()=>{try{localStorage.setItem("cfc_nomes",JSON.stringify(S.nomes))}catch(e){}};
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);
async function carregar(){const {data,error}=await sb.from("lancamentos").select("*").order("data",{ascending:false});if(error){alert("Erro ao carregar: "+error.message);return}S.itens=data.map(r=>({id:r.id,p:r.pessoa,kind:r.kind,desc:r.descricao,valor:Number(r.valor),data:r.data,cat:r.categoria,tipo:r.tipo||""}));render()}
const hoje=new Date().toISOString().slice(0,10);
const mes=document.getElementById("mes");mes.value=hoje.slice(0,7);
mes.onchange=render;
const sum=l=>l.reduce((t,i)=>t+i.valor,0);
const G=l=>l.filter(i=>i.kind!=="ganho"),I=l=>l.filter(i=>i.kind==="ganho");
function painel(p,cor){
  const L=S.itens.filter(i=>i.p===p&&i.data.startsWith(mes.value)).sort((x,y)=>y.data.localeCompare(x.data));
  const GL=G(L),ganho=sum(I(L)),fx=sum(GL.filter(i=>i.tipo==="fixo")),vr=sum(GL.filter(i=>i.tipo==="variavel")),tot=fx+vr,comb=sum(GL.filter(i=>i.cat==="Combustível"));
  const por=CATS.map(c=>[c,sum(GL.filter(i=>i.cat===c))]).filter(x=>x[1]>0).sort((x,y)=>y[1]-x[1]);
  return `<section class="p" style="--c:var(${cor})">
  <h2><span>${esc(S.nomes[p])}</span><button data-r="${p}">renomear</button></h2>
  <div class="sum"><div><small>Ganhos</small><b class="gn">${R(ganho)}</b></div><div><small>Gastos</small><b>${R(tot)}</b></div><div><small>Saldo</small><b class="${ganho-tot<0?"neg":"gn"}">${R(ganho-tot)}</b></div><div><small>Fixos</small><b>${R(fx)}</b></div><div><small>Variáveis</small><b>${R(vr)}</b></div><div><small>Combustível</small><b>${R(comb)}</b></div></div>
  <form data-p="${p}">
    <select class="w" name="kind"><option value="gasto">➖ Gasto</option><option value="ganho">➕ Ganho (salário, corridas do dia…)</option></select>
    <input class="w" name="desc" placeholder="Descrição (ex.: aluguel, gasolina, corridas de sábado)" required>
    <input name="valor" type="number" step="0.01" min="0.01" placeholder="Valor R$" required inputmode="decimal">
    <input name="data" type="date" value="${hoje}" required>
    <select name="cat">${CATS.map(c=>`<option>${c}</option>`).join("")}</select>
    <select name="tipo"><option value="variavel">Variável</option><option value="fixo">Fixo</option></select>
    <button class="w">+ Adicionar</button>
  </form>
  <h3>Gastos por categoria</h3>
  ${por.length?por.map(([c,v])=>`<div class="bar"><div><span>${c}</span><b>${R(v)}</b></div><i style="width:${Math.max(3,v/tot*100)}%"></i></div>`).join(""):'<div class="empty">Sem gastos neste mês.</div>'}
  <h3>Lançamentos</h3>
  <ul>${L.map(i=>`<li><div class="d">${esc(i.desc)}<span>${i.data.split("-").reverse().join("/")} · ${esc(i.cat)}</span></div>${i.kind==="ganho"?'<span class="t ganho">Ganho</span>':`<span class="t ${i.tipo}">${i.tipo==="fixo"?"Fixo":"Variável"}</span>`}<b class="${i.kind==="ganho"?"gn":""}">${i.kind==="ganho"?"+":"−"}${R(i.valor)}</b><button data-x="${i.id}" aria-label="Excluir">✕</button></li>`).join("")||'<li class="empty">Nada lançado.</li>'}</ul>
  </section>`;
}
function render(){
  const M=S.itens.filter(i=>i.data.startsWith(mes.value));
  const MG=G(M),gn=sum(I(M)),a=sum(MG.filter(i=>i.p==="a")),b=sum(MG.filter(i=>i.p==="b"));
  const fx=sum(MG.filter(i=>i.tipo==="fixo")),vr=sum(MG.filter(i=>i.tipo==="variavel"));
  document.getElementById("top").innerHTML=[["Ganhos do casal",gn,"gn"],["Gastos do casal",a+b],["Saldo do mês",gn-a-b,gn-a-b<0?"neg":"gn"],[S.nomes.a+" gastou",a],[S.nomes.b+" gastou",b],["Fixos",fx],["Variáveis",vr]].map(([n,v,c])=>`<div class="k"><small>${esc(n)}</small><b class="${c||""}">${R(v)}</b></div>`).join("");
  document.getElementById("cols").innerHTML=painel("a","--a")+painel("b","--b");
}
document.getElementById("cols").addEventListener("submit",async e=>{
  e.preventDefault();const f=e.target,d=new FormData(f),btn=f.querySelector("button");btn.disabled=true;
  const {error}=await sb.from("lancamentos").insert({pessoa:f.dataset.p,kind:d.get("kind"),descricao:d.get("desc"),valor:parseFloat(d.get("valor")),data:d.get("data"),categoria:d.get("cat"),tipo:d.get("kind")==="ganho"?null:d.get("tipo")});
  if(error){alert("Erro ao salvar: "+error.message);btn.disabled=false;return}
  if(d.get("data").slice(0,7)!==mes.value)mes.value=d.get("data").slice(0,7);
  await carregar();
});
document.getElementById("cols").addEventListener("change",e=>{
  if(e.target.name!=="kind")return;const f=e.target.form,g=e.target.value==="ganho";
  f.cat.innerHTML=(g?GANHOS:CATS).map(c=>`<option>${c}</option>`).join("");f.tipo.style.display=g?"none":"";
});
document.getElementById("cols").addEventListener("click",async e=>{
  const x=e.target.dataset.x,r=e.target.dataset.r;
  if(x){if(!confirm("Excluir este lançamento?"))return;const {error}=await sb.from("lancamentos").delete().eq("id",x);if(error)alert(error.message);else carregar()}
  if(r){const n=prompt("Novo nome:",S.nomes[r]);if(n&&n.trim()){S.nomes[r]=n.trim();save();render()}}
});
async function entrar(){
  const {data:{session}}=await sb.auth.getSession();
  document.getElementById("login").hidden=!!session;document.getElementById("app").hidden=!session;
  if(session)carregar();
}
document.getElementById("lf").addEventListener("submit",async e=>{
  e.preventDefault();const f=e.target;
  const {error}=await sb.auth.signInWithPassword({email:f.email.value,password:f.senha.value});
  if(error){document.getElementById("le").textContent="E-mail ou senha incorretos.";return}
  entrar();
});
document.getElementById("sair").onclick=async()=>{await sb.auth.signOut();S.itens=[];entrar()};
render();entrar();
</script>
</body>
</html>
