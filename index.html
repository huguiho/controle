<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finanças do Casal</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f6bff">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finanças">
<style>
:root{--bg:#eef1f7;--card:#fff;--tx:#172033;--mu:#6b7488;--bd:#e3e7f0;--a:#2f6bff;--b:#e0479e;--fx:#7a5af8;--ok:#16a36a;--ng:#e5484d;--vr:#e08a00;--sh:0 6px 22px rgba(30,45,90,.09)}
@media (prefers-color-scheme:dark){:root{--bg:#0e1220;--card:#181d30;--tx:#eef1fb;--mu:#98a1b8;--bd:#272e47;--a:#6c93ff;--b:#f276b8;--fx:#a48dff;--ok:#34d399;--ng:#ff6b70;--vr:#f5a524;--sh:0 6px 22px rgba(0,0,0,.35)}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px)}
input,select,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;min-width:0}
button{cursor:pointer}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:16px;background:linear-gradient(120deg,var(--a),var(--b));color:#fff;border-radius:0 0 24px 24px;box-shadow:var(--sh)}
.hd h1{font-size:1.15rem;margin:0}.hd div{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.hd button{background:rgba(255,255,255,.22);color:#fff;border:0;padding:8px 12px}
.wrap{max-width:1200px;margin:0 auto;padding:16px 16px 110px}
.bm{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.bm h2{margin:0;font-size:1.05rem}
.top{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.k{background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--sh)}.k small{color:var(--mu);display:block}.k b{font-size:1.25rem}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
.p{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--sh);border-top:6px solid var(--c)}
.p h2{margin:0 0 8px;font-size:1.1rem;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sm{font-size:.75rem;padding:5px 10px;color:var(--mu)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 12px}
.sum div{background:var(--bg);border-radius:12px;padding:8px}.sum small{color:var(--mu);display:block;font-size:.72rem}.sum b{font-size:.95rem}
form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.w{grid-column:1/-1}
.pr{background:var(--c,var(--a));color:#fff;border:0;font-weight:600}.gh{color:var(--mu)}
h3{font-size:.8rem;margin:14px 0 6px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.bar{margin:6px 0}.bar div:first-child{display:flex;justify-content:space-between;font-size:.88rem}.bar i{display:block;height:8px;border-radius:5px;background:var(--c);margin-top:3px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;gap:6px;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--bd)}
li .d{flex:1;min-width:0}li .d span{display:block;color:var(--mu);font-size:.78rem}
li.pend .d{opacity:.8}li.done .d{text-decoration:line-through;opacity:.55}
.ic{border:0;background:none;padding:6px}
.empty{color:var(--mu);padding:8px 0}
.gn{color:var(--ok)}.neg{color:var(--ng)}
.al{background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:var(--sh);border-left:6px solid var(--vr);margin-bottom:16px}.al h3{margin:0 0 4px}
.venc b,.venc .d{color:var(--ng)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}.ctl b{flex:1;text-align:center;min-width:150px;text-transform:capitalize}
.seg{display:flex;gap:4px}.seg .on,.nav .on{background:linear-gradient(120deg,var(--a),var(--b));color:#fff;border-color:transparent}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:5px;box-shadow:0 10px 30px rgba(0,0,0,.2);z-index:20}
.nav button{border:0;border-radius:99px;padding:10px 20px;background:none;font-weight:600;color:var(--mu)}
#toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(92vw,520px);background:#172033;color:#fff;padding:12px 14px;border-radius:14px;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.lg{grid-template-columns:1fr;max-width:340px;margin:12vh auto;padding:0 16px}.lg small{color:var(--ng)}
</style>
</head>
<body>
<div id="toast" hidden></div>
<div id="login" hidden><form id="lf" class="lg"><h1>💰 Finanças do Casal</h1><input name="email" type="email" placeholder="E-mail" required autocomplete="username"><input name="senha" type="password" placeholder="Senha" required autocomplete="current-password"><button class="pr">Entrar</button><small id="le"></small></form></div>
<div id="app" hidden>
<header class="hd"><h1>💰 Finanças do Casal</h1><div><button id="inst" hidden>📲 Instalar</button><button id="bell">🔔 Ativar</button><button id="sair">Sair</button></div></header>
<main class="wrap">
<section id="v-fin">
<div class="bm"><h2>Resumo do mês</h2><input type="month" id="mes" aria-label="Mês"></div>
<div id="alerta"></div><div class="top" id="top"></div><div class="cols" id="cols"></div>
</section>
<section id="v-ag" hidden></section>
</main>
<nav class="nav"><button data-v="fin" class="on">💰 Finanças</button><button data-v="ag">📅 Agenda</button></nav>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPA_URL="https://huyqddkuafeqjvhtxgcw.supabase.co",SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh1eXFkZGt1YWZlcWp2aHR4Z2N3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ4MDQxNzMsImV4cCI6MjExMDM4MDE3M30.R2ak24x5X7vLJCHWeosGNWaV-AQhi7dv_IzH28ZfBB0";
const CATS=["Moradia","Mercado","Transporte","Combustível","Manutenção da moto","Contas (luz, água, internet)","Saúde","Lazer","Educação","Assinaturas","Dívidas/Parcelas","Outros"];
const GANHOS=["Salário","Ganho do dia","Extra/Bico","Outros ganhos"];
const R=v=>v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const D=s=>new Date(s+"T12:00:00");
const addD=(s,n)=>{const d=D(s);d.setDate(d.getDate()+n);return iso(d)};
const fmt=s=>D(s).toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long"});
const br=s=>s.split("-").reverse().join("/");
const hoje=iso(new Date());
const opts=(l,s)=>l.map(c=>`<option${c===s?" selected":""}>${c}</option>`).join("");
let S={nomes:{a:"Hugo",b:"Esposa"},itens:[]},A=[],ED=null,AED=null,AG={d:hoje,m:"dia"},avisado=0,tt,iniciado=0;
try{const x=localStorage.getItem("cfc_nomes");if(x)S.nomes=JSON.parse(x)}catch(e){}
const save=()=>{try{localStorage.setItem("cfc_nomes",JSON.stringify(S.nomes))}catch(e){}};
const nome=p=>p==="ambos"?"Casal":S.nomes[p];
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);
const mes=$("mes");mes.value=hoje.slice(0,7);mes.onchange=renderFin;
const sum=l=>l.reduce((t,i)=>t+i.valor,0);
const G=l=>l.filter(i=>i.kind!=="ganho"),I=l=>l.filter(i=>i.kind==="ganho");
function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,9000)}
$("toast").onclick=()=>$("toast").hidden=true;

async function carregar(){
  const [l,c]=await Promise.all([sb.from("lancamentos").select("*").order("data",{ascending:false}),sb.from("compromissos").select("*")]);
  if(l.error)alert("Erro ao carregar lançamentos: "+l.error.message);
  else S.itens=l.data.map(r=>({id:r.id,p:r.pessoa,kind:r.kind,desc:r.descricao,valor:Number(r.valor),data:r.data,cat:r.categoria,tipo:r.tipo||"",pago:r.pago!==false}));
  if(c.error)toast("Agenda indisponível: "+c.error.message+" (rodou o SQL novo?)");
  else A=c.data.map(r=>({id:r.id,titulo:r.titulo,data:r.data,hora:r.hora?r.hora.slice(0,5):"",p:r.pessoa,notas:r.notas||"",lembrete:r.lembrete,feito:!!r.feito}));
  render();checar();
  const h=A.filter(c=>c.data===hoje&&!c.feito);
  if(h.length&&!avisado){avisado=1;toast("📅 Hoje: "+h.map(c=>(c.hora?c.hora+" ":"")+c.titulo).join(" · "))}
}

function painel(p,cor){
  const L=S.itens.filter(i=>i.p===p&&i.data.startsWith(mes.value)).sort((x,y)=>y.data.localeCompare(x.data));
  const GL=G(L),ganho=sum(I(L)),fx=sum(GL.filter(i=>i.tipo==="fixo")),tot=sum(GL),comb=sum(GL.filter(i=>i.cat==="Combustível")),pend=sum(GL.filter(i=>!i.pago));
  const por=CATS.map(c=>[c,sum(GL.filter(i=>i.cat===c))]).filter(x=>x[1]>0).sort((x,y)=>y[1]-x[1]);
  const e=ED&&ED.p===p?ED:{},g=e.kind==="ganho";
  return `<section class="p" style="--c:var(${cor})">
  <h2><span>${esc(S.nomes[p])}</span><button class="sm" data-r="${p}">renomear</button></h2>
  <div class="sum">${[["Ganhos",ganho,"gn"],["Gastos",tot],["Saldo",ganho-tot,ganho-tot<0?"neg":"gn"],["A pagar",pend],["Fixos",fx],["Combustível",comb]].map(([n,v,c])=>`<div><small>${n}</small><b class="${c||""}">${R(v)}</b></div>`).join("")}</div>
  <form data-p="${p}" data-id="${e.id||""}">
    <select class="w" name="kind"><option value="gasto"${g?"":" selected"}>➖ Gasto</option><option value="ganho"${g?" selected":""}>➕ Ganho (salário, corridas do dia…)</option></select>
    <input class="w" name="desc" value="${esc(e.desc||"")}" placeholder="Descrição (ex.: aluguel, gasolina, corridas de sábado)" required>
    <input name="valor" type="number" step="0.01" min="0.01" value="${e.valor||""}" placeholder="Valor R$" required inputmode="decimal">
    <input name="data" type="date" value="${e.data||hoje}" required>
    <select name="cat">${opts(g?GANHOS:CATS,e.cat)}</select>
    <select name="tipo"${g?' style="display:none"':""}><option value="variavel">Variável</option><option value="fixo"${e.tipo==="fixo"?" selected":""}>Fixo</option></select>
    <select class="w" name="pago"><option value="1">✅ Pago / recebido</option><option value="0"${e.pago===false?" selected":""}>⏳ Pendente (a pagar / a receber)</option></select>
    <button class="w pr">${e.id?"Salvar alterações":"+ Adicionar"}</button>${e.id?'<button type="button" class="w gh" data-c="1">Cancelar edição</button>':""}
  </form>
  <h3>Gastos por categoria</h3>
  ${por.length?por.map(([c,v])=>`<div class="bar"><div><span>${c}</span><b>${R(v)}</b></div><i style="width:${Math.max(3,v/tot*100)}%"></i></div>`).join(""):'<div class="empty">Sem gastos neste mês.</div>'}
  <h3>Lançamentos</h3>
  <ul>${L.map(i=>`<li class="${i.pago?"":"pend"}"><button class="ic" data-k="${i.id}" title="Alternar pago/pendente">${i.pago?"✅":"⏳"}</button><div class="d">${esc(i.desc)}<span>${br(i.data)} · ${esc(i.cat)}${i.tipo==="fixo"?" · fixo":""}${i.pago?"":" · pendente"}</span></div><b class="${i.kind==="ganho"?"gn":""}">${i.kind==="ganho"?"+":"−"}${R(i.valor)}</b><button class="ic" data-e="${i.id}" aria-label="Editar">✏️</button><button class="ic" data-x="${i.id}" aria-label="Excluir">✕</button></li>`).join("")||'<li class="empty">Nada lançado.</li>'}</ul>
  </section>`;
}
function renderFin(){
  const M=S.itens.filter(i=>i.data.startsWith(mes.value)),MG=G(M),gn=sum(I(M)),a=sum(MG.filter(i=>i.p==="a")),b=sum(MG.filter(i=>i.p==="b")),pend=sum(MG.filter(i=>!i.pago));
  $("top").innerHTML=[["Ganhos do casal",gn,"gn"],["Gastos do casal",a+b],["Saldo do mês",gn-a-b,gn-a-b<0?"neg":"gn"],[S.nomes.a+" gastou",a],[S.nomes.b+" gastou",b],["A pagar (pendentes)",pend]].map(([n,v,c])=>`<div class="k"><small>${esc(n)}</small><b class="${c||""}">${R(v)}</b></div>`).join("");
  const P=S.itens.filter(i=>i.kind!=="ganho"&&!i.pago&&i.data<=addD(hoje,7)).sort((x,y)=>x.data.localeCompare(y.data));
  $("alerta").innerHTML=P.length?`<div class="al"><h3>⏳ Contas a pagar · atrasadas e próximos 7 dias</h3><ul>${P.map(i=>`<li class="${i.data<hoje?"venc":""}"><div class="d">${esc(i.desc)}<span>${esc(nome(i.p))} · vence ${br(i.data)}${i.data<hoje?" · atrasada":""}</span></div><b>${R(i.valor)}</b><button class="sm" data-k="${i.id}">Pagar</button></li>`).join("")}</ul></div>`:"";
  $("cols").innerHTML=painel("a","--a")+painel("b","--b");
}

const ws=s=>addD(s,-((D(s).getDay()+6)%7));
const LEM=[["","Sem lembrete"],["0","Na hora"],["15","15 min antes"],["60","1 hora antes"],["1440","1 dia antes"]];
function renderAg(){
  const sem=AG.m==="semana",days=sem?[...Array(7)].map((_,i)=>addD(ws(AG.d),i)):[AG.d],e=AED||{};
  const lab=sem?br(days[0])+" – "+br(days[6]):fmt(AG.d);
  $("v-ag").innerHTML=`<div class="ctl"><button data-a="prev">‹</button><b>${lab}</b><button data-a="next">›</button><button data-a="hoje">Hoje</button><span class="seg"><button data-m="dia" class="${sem?"":"on"}">Dia</button><button data-m="semana" class="${sem?"on":""}">Semana</button></span></div>
  <div class="cols"><section class="p" style="--c:var(--ok)"><h2>Compromissos</h2>${days.map(dy=>{
    const L=A.filter(c=>c.data===dy).sort((x,y)=>(x.hora||"").localeCompare(y.hora||""));
    return `${sem?`<h3>${fmt(dy)}${dy===hoje?" · hoje":""}</h3>`:""}${L.length?`<ul>${L.map(c=>`<li class="${c.feito?"done":""}"><button class="ic" data-af="${c.id}">${c.feito?"✅":"⬜"}</button><div class="d"><b>${c.hora||"O dia todo"}</b> · ${esc(c.titulo)}<span>${esc(nome(c.p))}${c.lembrete!=null?" · 🔔 "+LEM.find(x=>x[0]===String(c.lembrete))?.[1]:""}${c.notas?" · "+esc(c.notas):""}</span></div><button class="ic" data-ae="${c.id}">✏️</button><button class="ic" data-ax="${c.id}">✕</button></li>`).join("")}</ul>`:'<div class="empty">Livre</div>'}`}).join("")}</section>
  <section class="p" style="--c:var(--fx)"><h2>${e.id?"Editar compromisso":"Novo compromisso"}</h2>
  <form id="af" data-id="${e.id||""}">
    <input class="w" name="titulo" value="${esc(e.titulo||"")}" placeholder="Título (ex.: consulta, pagar boleto)" required>
    <input name="data" type="date" value="${e.data||AG.d}" required>
    <input name="hora" type="time" value="${e.hora||""}">
    <select name="pessoa"><option value="ambos"${e.p==="ambos"||!e.p?" selected":""}>Casal</option><option value="a"${e.p==="a"?" selected":""}>${esc(S.nomes.a)}</option><option value="b"${e.p==="b"?" selected":""}>${esc(S.nomes.b)}</option></select>
    <select name="lem">${LEM.map(([v,t])=>`<option value="${v}"${String(e.lembrete??"")===v?" selected":""}>${t}</option>`).join("")}</select>
    <input class="w" name="notas" value="${esc(e.notas||"")}" placeholder="Anotações (opcional)">
    <button class="w pr">${e.id?"Salvar alterações":"+ Adicionar"}</button>${e.id?'<button type="button" class="w gh" data-ac="1">Cancelar edição</button>':""}
  </form></section></div>`;
}
function render(){renderFin();renderAg()}

async function notif(t,b){
  toast("⏰ "+t+(b?" — "+b:""));
  if(!("Notification"in window)||Notification.permission!=="granted")return;
  try{const r=await navigator.serviceWorker.ready;r.showNotification(t,{body:b,icon:"icon-192.png"})}catch(e){try{new Notification(t,{body:b})}catch(_){}}
}
function checar(){
  let v=[];try{v=JSON.parse(localStorage.getItem("cfc_n")||"[]")}catch(e){}
  const n=Date.now();
  for(const c of A){
    if(c.feito||c.lembrete==null)continue;
    const t=new Date(c.data+"T"+(c.hora||"08:00")+":00").getTime(),f=t-c.lembrete*6e4,k=c.id+"@"+f;
    if(n>=f&&n<t+36e5&&!v.includes(k)){v.push(k);notif(c.titulo,(c.hora||"hoje")+(c.notas?" · "+c.notas:""))}
  }
  try{localStorage.setItem("cfc_n",JSON.stringify(v.slice(-200)))}catch(e){}
}
const sino=()=>$("bell").textContent=("Notification"in window&&Notification.permission==="granted")?"🔔 Ligado":"🔔 Ativar";

document.addEventListener("click",async e=>{
  const t=e.target.closest("button");if(!t)return;const d=t.dataset;
  if(d.v){["fin","ag"].forEach(v=>$("v-"+v).hidden=v!==d.v);document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===d.v));scrollTo(0,0)}
  if(d.x){if(!confirm("Excluir este lançamento?"))return;const {error}=await sb.from("lancamentos").delete().eq("id",d.x);if(error)alert(error.message);else carregar()}
  if(d.k){const i=S.itens.find(i=>String(i.id)===d.k);const {error}=await sb.from("lancamentos").update({pago:!i.pago}).eq("id",d.k);if(error)alert(error.message);else carregar()}
  if(d.e){ED={...S.itens.find(i=>String(i.id)===d.e)};renderFin();document.querySelector(`form[data-p="${ED.p}"]`).scrollIntoView({behavior:"smooth",block:"center"})}
  if(d.c){ED=null;renderFin()}
  if(d.r){const n=prompt("Novo nome:",S.nomes[d.r]);if(n&&n.trim()){S.nomes[d.r]=n.trim();save();render()}}
  if(d.a){AG.d=d.a==="hoje"?hoje:addD(AG.d,(d.a==="prev"?-1:1)*(AG.m==="semana"?7:1));renderAg()}
  if(d.m){AG.m=d.m;renderAg()}
  if(d.af){const c=A.find(c=>String(c.id)===d.af);await sb.from("compromissos").update({feito:!c.feito}).eq("id",d.af);carregar()}
  if(d.ae){AED={...A.find(c=>String(c.id)===d.ae)};renderAg();$("af").scrollIntoView({behavior:"smooth",block:"center"})}
  if(d.ac){AED=null;renderAg()}
  if(d.ax){if(!confirm("Excluir este compromisso?"))return;await sb.from("compromissos").delete().eq("id",d.ax);carregar()}
  if(t.id==="sair"){await sb.auth.signOut();S.itens=[];A=[];entrar()}
  if(t.id==="bell"&&"Notification"in window){await Notification.requestPermission();sino()}
  if(t.id==="inst"&&dp){dp.prompt();t.hidden=true}
});
document.addEventListener("submit",async e=>{
  e.preventDefault();const f=e.target,d=new FormData(f);
  if(f.id==="lf"){
    const {error}=await sb.auth.signInWithPassword({email:f.email.value,password:f.senha.value});
    if(error){$("le").textContent="E-mail ou senha incorretos.";return}
    return entrar();
  }
  const btn=f.querySelector(".pr");btn.disabled=true;let row,tb;
  if(f.id==="af"){
    tb="compromissos";row={titulo:d.get("titulo"),data:d.get("data"),hora:d.get("hora")||null,pessoa:d.get("pessoa"),notas:d.get("notas")||null,lembrete:d.get("lem")===""?null:parseInt(d.get("lem"))};
  }else{
    tb="lancamentos";row={pessoa:f.dataset.p,kind:d.get("kind"),descricao:d.get("desc"),valor:parseFloat(d.get("valor")),data:d.get("data"),categoria:d.get("cat"),tipo:d.get("kind")==="ganho"?null:d.get("tipo"),pago:d.get("pago")==="1"};
  }
  const {error}=await(f.dataset.id?sb.from(tb).update(row).eq("id",f.dataset.id):sb.from(tb).insert(row));
  if(error){alert("Erro ao salvar: "+error.message);btn.disabled=false;return}
  if(tb==="compromissos"){AED=null;AG.d=row.data}else{ED=null;if(row.data.slice(0,7)!==mes.value)mes.value=row.data.slice(0,7)}
  await carregar();
});
document.addEventListener("change",e=>{
  if(e.target.name!=="kind")return;const f=e.target.form,g=e.target.value==="ganho";
  f.cat.innerHTML=opts(g?GANHOS:CATS);f.tipo.style.display=g?"none":"";
});
let dp;addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e;$("inst").hidden=false});
async function entrar(){
  const {data:{session}}=await sb.auth.getSession();
  $("login").hidden=!!session;$("app").hidden=!session;
  if(session){sino();carregar();if(!iniciado){iniciado=1;setInterval(checar,30000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)checar()})}}
}
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));
render();entrar();
</script>
